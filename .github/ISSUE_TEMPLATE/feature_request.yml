name: Feature request / 功能建议
description: Suggest a focused improvement / 提出一个聚焦的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: Describe the workflow problem before the proposed UI or technology. / 先描述工作流问题，再描述方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的其他方案

